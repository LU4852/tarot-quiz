<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI實作範例：塔羅新手教學</title>
    <style>
        :root {
            --primary-color: #4a154b;
            --secondary-color: #611f69;
            --accent-color: #e0a96d;
            --bg-color: #1a1a2e;
            --card-width: 95px;
            --card-height: 160px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 50px;
        }

        /* 控制面板與牌陣按鈕 */
        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .spread-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            background-color: transparent;
            color: #fff;
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn:hover, .btn.active {
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(224, 169, 109, 0.5);
        }

        .action-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn-action {
            background-color: var(--primary-color);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background-color: var(--secondary-color);
        }

        /* 牌陣模擬畫布 */
        .tabletop {
            width: 100%;
            height: 600px;
            background: radial-gradient(circle, #2c163f 0%, #12071f 100%);
            border-radius: 15px;
            border: 2px solid var(--accent-color);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        /* 牌陣定位輔助框（虛線底框） */
        .card-slot {
            position: absolute;
            width: var(--card-width);
            height: var(--card-height);
            border: 2px dashed rgba(224, 169, 109, 0.35);
            border-radius: 8px;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .slot-label {
            font-size: 0.75rem;
            color: var(--accent-color);
            text-align: center;
            background: rgba(26, 26, 46, 0.9);
            padding: 4px 6px;
            border-radius: 4px;
            margin-top: 5px;
            border: 1px solid rgba(224, 169, 109, 0.2);
            white-space: nowrap;
        }

        /* 塔羅牌主體 */
        .card {
            width: var(--card-width);
            height: var(--card-height);
            position: absolute;
            cursor: grab;
            user-select: none;
            touch-action: none;
            z-index: 5;
            transition: transform 0.1s ease, box-shadow 0.3s ease;
        }

        .card:active {
            cursor: grabbing;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* 翻牌狀態 */
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* 逆位狀態 - 作用在卡片外層 */
        .card.reversed {
            transform: rotate(180deg);
        }

        /* 處理塞爾特十字第2張牌（橫跨在第1張牌上）的旋轉與逆位疊加效果 */
        .card.cross-overlap {
            transform: rotate(90deg);
        }
        .card.cross-overlap.reversed {
            transform: rotate(270deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            border: 2px solid var(--accent-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            overflow: hidden;
        }

        /* 牌背 */
        .card-back {
            background: linear-gradient(135deg, #0f0c1b, #2c163f);
            color: var(--accent-color);
            justify-content: center;
        }

        .card-back-pattern {
            width: 85%;
            height: 85%;
            border: 1px dashed rgba(224, 169, 109, 0.5);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
        }

        /* 牌面 */
        .card-front {
            background-color: #fff;
            color: #000;
            transform: rotateY(180deg);
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
            color: var(--primary-color);
        }

        .card-illustration {
            font-size: 2.2rem;
            margin: 5px 0;
        }

        /* 關鍵字顯示區域：高對比度、防遮蔽 */
        .keyword-tag {
            background-color: rgba(0, 0, 0, 0.88);
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 6px;
            border-radius: 4px;
            text-align: center;
            width: 95%;
            word-wrap: break-word;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.25);
            z-index: 10;
        }

        /* 當卡牌旋轉（逆位或橫置）時，反向修正關鍵字的角度，確保文字永遠水平可讀 */
        .card.reversed .keyword-tag {
            transform: rotate(180deg);
        }
        .card.cross-overlap .keyword-tag {
            transform: rotate(-90deg);
        }
        .card.cross-overlap.reversed .keyword-tag {
            transform: rotate(-270deg);
        }

        /* 底部資訊板 */
        .info-panel {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 80px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* 響應式微調 */
        @media (max-width: 768px) {
            :root {
                --card-width: 70px;
                --card-height: 120px;
            }
            .tabletop {
                height: 520px;
            }
            .card-illustration {
                font-size: 1.5rem;
            }
            .card-title {
                font-size: 0.65rem;
            }
            .keyword-tag {
                font-size: 0.65rem;
                padding: 2px 4px;
            }
            .slot-label {
                font-size: 0.65rem;
                padding: 2px 4px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>AI實作範例：塔羅新手教學</h1>
    </header>

    <div class="container">
        <!-- 頂部控制面板 -->
        <div class="control-panel">
            <div class="spread-selector">
                <button class="btn active" onclick="selectSpread('free')">自由自選</button>
                <button class="btn" onclick="selectSpread('one')">單牌直覺</button>
                <button class="btn" onclick="selectSpread('three')">聖三角 (時間流)</button>
                <button class="btn" onclick="selectSpread('choices')">二選一牌陣</button>
                <button class="btn" onclick="selectSpread('cross')">塞爾特十字</button>
            </div>
            <div class="action-group">
                <button class="btn btn-action" onclick="dealCards()">洗牌開局</button>
                <button class="btn btn-action" style="background-color: #6c757d;" onclick="resetTable()">清空桌面</button>
            </div>
        </div>

        <!-- 牌陣大畫布 -->
        <div id="tabletop" class="tabletop"></div>

        <!-- 說明與解讀資訊 -->
        <div id="info-panel" class="info-panel">
            💡 <strong>使用說明：</strong>請點選上方欲模擬的「牌陣類型」，再按下「洗牌開局」。點擊卡牌即可「翻牌」，雙擊卡牌切換「正位/逆位」。卡牌均可自由拖曳。
        </div>
    </div>

    <script>
        // 大阿爾克那經典卡牌資料
        const tarotDeck = [
            { id: 0, name: "愚者", symbol: "🃏", keyword: "冒險、全新開始、自由" },
            { id: 1, name: "魔術師", symbol: "🧙‍♂️", keyword: "創造力、專注、主動" },
            { id: 2, name: "女祭司", symbol: "🔮", keyword: "直覺、潛意識、智慧" },
            { id: 3, name: "女皇", symbol: "👑", keyword: "豐收、自然、孕育" },
            { id: 4, name: "皇帝", symbol: "⚔️", keyword: "控制、權威、秩序" },
            { id: 5, name: "教皇", symbol: "📜", keyword: "傳統、精神引導、體制" },
            { id: 6, name: "戀人", symbol: "💖", keyword: "選擇、和諧、關係" },
            { id: 7, name: "戰車", symbol: "🛡️", keyword: "意志力、勝利、前進" },
            { id: 8, name: "力量", symbol: "🦁", keyword: "勇氣、耐性、內在力量" },
            { id: 9, name: "隱士", symbol: "🕯️", keyword: "內省、孤獨、尋求真理" },
            { id: 10, name: "命運之輪", symbol: "🎡", keyword: "轉機、命運、運氣" },
            { id: 11, name: "正義", symbol: "⚖️", keyword: "公平、真理、因果" },
            { id: 12, name: "吊人", symbol: "⚓", keyword: "犧牲、換位思考、等待" },
            { id: 13, name: "死神", symbol: "💀", keyword: "結束、轉變、新生" },
            { id: 14, name: "節制", symbol: "🧪", keyword: "平衡、調和、淨化" },
            { id: 15, name: "惡魔", symbol: "😈", keyword: "執著、物質誘惑、束縛" },
            { id: 16, name: "高塔", symbol: "⚡", keyword: "劇變、破壞、覺醒" },
            { id: 17, name: "星星", symbol: "⭐", keyword: "希望、信心、療癒" },
            { id: 18, name: "月亮", symbol: "🌙", keyword: "不安、恐懼、潛意識" },
            { id: 19, name: "太陽", symbol: "☀️", keyword: "成功、活力、喜悅" },
            { id: 20, name: "審判", symbol: "🔔", keyword: "呼喚、重大決定、覺醒" },
            { id: 21, name: "世界", symbol: "🌍", keyword: "圓滿、達成、旅程終點" }
        ];

        // 牌陣配置座標與正統含意 (X%, Y% 絕對精準定位)
        const spreads = {
            free: [],
            one: [
                { name: "核心解答", x: 50, y: 50 }
            ],
            three: [ // 正統倒三角形聖三角
                { name: "1. 過去 (左上)", x: 30, y: 35 },
                { name: "2. 現在 (右上)", x: 70, y: 35 },
                { name: "3. 未來 (下方)", x: 50, y: 70 }
            ],
            choices: [ // 分叉選擇牌陣
                { name: "1. 現狀/問題", x: 50, y: 75 },
                { name: "2. 選擇A現狀", x: 25, y: 45 },
                { name: "3. 選擇A未來結果", x: 25, y: 15 },
                { name: "4. 選擇B現狀", x: 75, y: 45 },
                { name: "5. 選擇B未來結果", x: 75, y: 15 }
            ],
            cross: [ // 標準塞爾特十字
                { name: "1. 當前處境(中心)", x: 40, y: 50 },
                { name: "2. 面臨障礙(橫跨)", x: 40, y: 50, special: "overlap" }, // 疊在第1張上
                { name: "3. 目標/意識層", x: 40, y: 15 },
                { name: "4. 潛意識根基", x: 40, y: 85 },
                { name: "5. 過去影響", x: 18, y: 50 },
                { name: "6. 即將到來", x: 62, y: 50 },
                { name: "7. 自身狀況", x: 85, y: 85 },
                { name: "8. 外界環境", x: 85, y: 62 },
                { name: "9. 希望與恐懼", x: 85, y: 38 },
                { name: "10. 最終結果", x: 85, y: 15 }
            ]
        };

        let currentSpread = 'free';
        const tabletop = document.getElementById('tabletop');
        const infoPanel = document.getElementById('info-panel');

        function selectSpread(type) {
            currentSpread = type;
            document.querySelectorAll('.spread-selector .btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            drawSlots();
        }

        // 渲染底板虛線框與標籤
        function drawSlots() {
            document.querySelectorAll('.card-slot').forEach(slot => slot.remove());
            const config = spreads[currentSpread];
            if (!config) return;

            config.forEach(item => {
                const slot = document.createElement('div');
                slot.className = 'card-slot';
                slot.style.left = `${item.x}%`;
                slot.style.top = `${item.y}%`;
                
                // 塞爾特十字第二張特殊處理
                if (item.special === "overlap") {
                    slot.style.transform = `translate(-50%, -50%) rotate(90deg)`;
                }

                const label = document.createElement('div');
                label.className = 'slot-label';
                label.innerText = item.name;
                slot.appendChild(label);
                
                tabletop.appendChild(slot);
            });
        }

        function resetTable() {
            document.querySelectorAll('.card').forEach(card => card.remove());
            infoPanel.innerHTML = '🔮 桌面已清空。選擇預定牌陣後，點擊「洗牌開局」即可進行占卜。';
        }

        // 進行洗牌發牌
        function dealCards() {
            resetTable();
            drawSlots();

            const shuffled = [...tarotDeck].sort(() => Math.random() - 0.5);
            const config = spreads[currentSpread];

            if (currentSpread === 'free' || !config || config.length === 0) {
                // 自由模式隨機落點
                for (let i = 0; i < 5; i++) {
                    createCard(shuffled[i], 30 + (i * 10), 45);
                }
                infoPanel.innerHTML = '🔮 已預發 5 張卡牌。你可以自由拖曳至任何位置，並自訂牌陣。';
            } else {
                // 按預定牌陣之固定位置發牌
                config.forEach((slotInfo, index) => {
                    if (shuffled[index]) {
                        const isReversed = Math.random() > 0.75; // 25% 隨機逆位率
                        createCard(
                            shuffled[index], 
                            slotInfo.x, 
                            slotInfo.y, 
                            isReversed, 
                            slotInfo.special === "overlap", 
                            slotInfo.name
                        );
                    }
                });
                infoPanel.innerHTML = `🔮 <b>${document.querySelector('.spread-selector .btn.active').innerText}</b> 已依照既定位置發牌完畢。點擊卡牌翻開，雙擊可逆位微調。`;
            }
        }

        // 建立卡牌 DOM 元素
        function createCard(data, xPercent, yPercent, isReversed = false, isOverlap = false, slotName = '') {
            const card = document.createElement('div');
            card.className = 'card';
            
            // 塞爾特十字第二張牌特殊橫放樣式處理
            if (isOverlap) {
                card.classList.add('cross-overlap');
            }
            if (isReversed) {
                card.classList.add('reversed');
            }
            
            card.style.left = `calc(${xPercent}% - (var(--card-width) / 2))`;
            card.style.top = `calc(${yPercent}% - (var(--card-height) / 2))`;

            const inner = document.createElement('div');
            inner.className = 'card-inner';
            
            // 牌背
            const back = document.createElement('div');
            back.className = 'card-face card-back';
            back.innerHTML = `<div class="card-back-pattern">✨</div>`;
            
            // 牌面與防遮蔽關鍵字
            const front = document.createElement('div');
            front.className = 'card-face card-front';
            front.innerHTML = `
                <div class="card-title">${data.name}</div>
                <div class="card-illustration">${data.symbol}</div>
                <div class="keyword-tag">${data.keyword}</div>
            `;

            inner.appendChild(back);
            inner.appendChild(front);
            card.appendChild(inner);
            tabletop.appendChild(card);

            // 單擊事件：翻牌
            card.addEventListener('click', () => {
                if (card.dataset.dragging === 'true') return;
                
                card.classList.toggle('flipped');
                const stateText = card.classList.contains('reversed') ? '逆位' : '正位';
                const spreadContext = slotName ? ` [${slotName}]` : '';
                
                if (card.classList.contains('flipped')) {
                    infoPanel.innerHTML = `🌟<strong>翻開${spreadContext}：</strong> ${data.name} (${stateText}) — <em>關鍵提示：${data.keyword}</em>`;
                }
            });

            // 雙擊事件：旋轉 180 度（正/逆位）
            card.addEventListener('dblclick', () => {
                card.classList.toggle('reversed');
                const stateText = card.classList.contains('reversed') ? '逆位' : '正位';
                infoPanel.innerHTML = `🔄 <b>已變更正逆位</b>：${data.name} 切換為 <strong>${stateText}</strong>。`;
            });

            enableDrag(card);
        }

        // 拖曳模組（支援行動裝置觸控）
        function enableDrag(elm) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elm.onmousedown = dragMouseDown;
            elm.addEventListener('touchstart', dragTouchStart, { passive: false });

            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                elm.dataset.dragging = 'false';
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                elm.style.zIndex = 100;
            }

            function elementDrag(e) {
                e = e || window.event;
                elm.dataset.dragging = 'true';
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elm.style.top = `${elm.offsetTop - pos2}px`;
                elm.style.left = `${elm.offsetLeft - pos1}px`;
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                setTimeout(() => {
                    elm.style.zIndex = 5;
                }, 100);
            }

            function dragTouchStart(e) {
                elm.dataset.dragging = 'false';
                const touch = e.touches[0];
                pos3 = touch.clientX;
                pos4 = touch.clientY;
                elm.style.zIndex = 100;

                const touchMove = (e) => {
                    elm.dataset.dragging = 'true';
                    const t = e.touches[0];
                    pos1 = pos3 - t.clientX;
                    pos2 = pos4 - t.clientY;
                    pos3 = t.clientX;
                    pos4 = t.clientY;
                    elm.style.top = `${elm.offsetTop - pos2}px`;
                    elm.style.left = `${elm.offsetLeft - pos1}px`;
                };

                const touchEnd = () => {
                    document.removeEventListener('touchmove', touchMove);
                    document.removeEventListener('touchend', touchEnd);
                    setTimeout(() => {
                        elm.style.zIndex = 5;
                    }, 100);
                };

                document.addEventListener('touchmove', touchMove, { passive: false });
                document.addEventListener('touchend', touchEnd);
            }
        }

        drawSlots();
    </script>
</body>
</html>
