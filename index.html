<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI實作範例：塔羅新手教學</title>
    <style>
        :root {
            --bg-color: #0f0f1a;
            --card-bg: #1a1a2e;
            --panel-bg: #16213e;
            --accent-color: #f1c40f;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --primary-btn: #3498db;
            --secondary-btn: #e67e22;
            --story-btn: #9b59b6;
            --spread-btn: #1abc9c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: block;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 780px;
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid #252542;
            text-align: center;
            margin: 0 auto;
        }

        h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .nav-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 14px 10px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .btn-draw { background-color: var(--primary-btn); color: white; }
        .btn-quiz { background-color: var(--secondary-btn); color: white; }
        .btn-story { background-color: var(--story-btn); color: white; }
        .btn-spread { background-color: var(--spread-btn); color: white; }
        .btn-submit { background-color: var(--success-color); color: white; width: 100%; margin-top: 15px; }
        .btn-reveal { background-color: var(--accent-color); color: #1a1a2e; width: 100%; margin-top: 15px; }
        
        button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .display-board {
            background-color: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            min-height: 220px;
            text-align: left;
            line-height: 1.7;
            margin-bottom: 20px;
            border-left: 5px solid var(--accent-color);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .tarot-image-container {
            text-align: center;
            margin: 15px 0;
        }

        .tarot-img {
            width: 130px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border: 2px solid var(--accent-color);
            transition: transform 0.3s ease;
            margin: 5px;
        }

        .tarot-img.reversed-img {
            transform: rotate(180deg);
        }

        .interactive-zone {
            display: none;
            margin-top: 20px;
            background-color: #1f1f3a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #2d2d54;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 2px solid #34495e;
            background-color: var(--bg-color);
            color: white;
            font-size: 1.1rem;
            box-sizing: border-box;
            text-align: center;
        }

        textarea {
            text-align: left;
            resize: vertical;
            font-size: 1rem;
        }

        select {
            text-align-last: center;
            margin-bottom: 15px;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .highlight { color: var(--accent-color); font-weight: bold; }
        .upright { color: var(--success-color); font-weight: bold; }
        .reversed { color: var(--danger-color); font-weight: bold; }
        
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            font-size: 1.1rem;
            min-height: 40px;
        }

        .divider {
            border: 0;
            border-top: 1px solid #2d2d54;
            margin: 15px 0;
        }

        /* --- 牌陣擬真排版核心 CSS --- */
        .spread-grid {
            display: grid;
            gap: 15px;
            margin-top: 25px;
        }

        /* 1. 三張牌 - 聖三角 (橫向等寬) */
        .spread-layout-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        /* 2. 四張牌 - 直指核心 (十字型 3x3) */
        .spread-layout-4 {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: auto auto;
        }
        .spread-layout-4 .pos-0 { grid-column: 2; grid-row: 2; } /* 問題核心 */
        .spread-layout-4 .pos-1 { grid-column: 1; grid-row: 2; } /* 面臨障礙 */
        .spread-layout-4 .pos-2 { grid-column: 2; grid-row: 1; } /* 建議對策 (上方) */
        .spread-layout-4 .pos-3 { grid-column: 3; grid-row: 2; } /* 擁有資源 */

        /* 3. 五張牌 - 二選一 (Y字二選一 3x3) */
        .spread-layout-5-choice {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: auto auto auto;
        }
        .spread-layout-5-choice .pos-0 { grid-column: 1; grid-row: 2; } /* 選項 A */
        .spread-layout-5-choice .pos-1 { grid-column: 3; grid-row: 2; } /* 選項 B */
        .spread-layout-5-choice .pos-2 { grid-column: 1; grid-row: 1; } /* A 的結果 (左上) */
        .spread-layout-5-choice .pos-3 { grid-column: 3; grid-row: 1; } /* B 的結果 (右上) */
        .spread-layout-5-choice .pos-4 { grid-column: 2; grid-row: 3; } /* 當事人 (中下) */

        /* 4. 五張牌 - 感情萬用 (雙人對稱 3x2) */
        .spread-layout-5-love {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: auto auto;
        }
        .spread-layout-5-love .pos-0 { grid-column: 1; grid-row: 1; } /* 我的狀態 (左上) */
        .spread-layout-5-love .pos-1 { grid-column: 1; grid-row: 2; } /* 我的態度 (左下) */
        .spread-layout-5-love .pos-2 { grid-column: 3; grid-row: 1; } /* 對方的狀態 (右上) */
        .spread-layout-5-love .pos-3 { grid-column: 3; grid-row: 2; } /* 對方的態度 (右下) */
        .spread-layout-5-love .pos-4 { grid-column: 2; grid-row: 2; } /* 兩人結果 (中下) */

        .spread-card-box {
            background-color: rgba(255,255,255,0.03);
            border: 1px solid #34495e;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .spread-pos-title {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 8px;
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spread-card-box img {
            max-width: 100px;
            height: auto;
        }

        /* 響應式微調：手機板縮小卡片避免擠壓 */
        @media (max-width: 600px) {
            .spread-card-box img {
                max-width: 70px;
            }
            .spread-pos-title {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔮 AI實作範例：塔羅新手教學</h1>
    <div class="subtitle">新增「4大萬用牌陣」模擬模組，全面訓練你的占卜脈絡</div>
    
    <div class="nav-buttons">
        <button class="btn-draw" onclick="drawCard()">每日一牌 (抽牌)</button>
        <button class="btn-quiz" onclick="startQuiz()">圖像聯想測驗</button>
        <button class="btn-story" onclick="startStoryMode()">看圖說故事</button>
        <button class="btn-spread" onclick="startSpreadMode()">4大牌陣模擬 🆕</button>
    </div>

    <div class="display-board" id="displayBoard">
        <div style="text-align: center; color: var(--text-muted); padding-top: 20px;">
            <p style="font-size: 1.1rem; color: var(--accent-color); margin-bottom: 15px;"><strong>【新手修練四大模式】</strong></p>
            <p style="margin-bottom: 10px;">🏷️ <strong>每日一牌</strong>：看著對應的真圖，快速吸收正逆位核心含意。</p>
            <p style="margin-bottom: 10px;">🧠 <strong>圖像聯想測驗</strong>：遮蔽圖片，盲測你對畫面視覺特徵的記憶。</p>
            <p style="margin-bottom: 10px;">🎨 <strong>看圖說故事</strong>：只看圖片細節，逼迫自己用直覺連結生命故事。</p>
            <p style="margin-bottom: 25px;">📐 <strong>4大牌陣模擬</strong>：掌握「一蘿蔔一坑」心法，實際抽牌並理解各位置含意！</p>
            <p style="font-size: 0.9rem; color: #64748b;">💡 點選上方按鈕開啟你的學習與占卜之旅吧！</p>
        </div>
    </div>

    <!-- 交互操作區（動態切換內容） -->
    <div class="interactive-zone" id="interactiveZone">
        <div id="zoneContent"></div>
        <div class="feedback" id="feedbackZone"></div>
    </div>
</div>

<script>

        {"name": "19. 太陽 (The Sun)", "keyword": "太陽", "img": "https://upload.wikimedia.org/wikipedia/commons/1/17/RWS_Tarot_19_Sun.jpg", "visual": "快樂的裸體小孩騎在白馬上、手舉紅色大旗、背景是向日葵與金色圍牆", "upright": "成功、快樂、活力、自信、光明、真相、新生、豐盛", "reversed": "短暫的挫折、熱情消退、過度自信、虛榮、缺乏活力"},
        {"name": "20. 審判 (The Judgement)", "keyword": "審判", "img": "https://upload.wikimedia.org/wikipedia/commons/d/dd/RWS_Tarot_20_Judgement.jpg", "visual": "大天使在雲端吹響號角、號角上有十字旗、地面上許多人從棺材中甦醒並歡呼", "upright": "召喚、開悟、重大決定、重生、因果清算、回顧與檢討", "reversed": "拒絕召喚、自我懷疑、錯失良機、拖延決策、不願面對過去"},
        {"name": "21. 世界 (The World)", "keyword": "世界", "img": "https://upload.wikimedia.org/wikipedia/commons/f/ff/RWS_Tarot_21_World.jpg", "visual": "舞者身披紫色絲帶在綠色桂冠圈內跳舞、四角分別是人、鷹、牛、獅的頭像", "upright": "完成、圓滿、成功、旅行、圓滿結局、融合、達到目標", "reversed": "未完成、延遲、缺乏成果、功虧一簣、停滯不前、眼高手低"}
    ];

    // 已將時間之流移除，只保留4大萬用牌陣
    const SPREADS = {
        "triangle": {
            "name": "三張牌｜聖三角牌陣",
            "desc": "適合用來找出自己的盲點與事情真相，分析「我以為的、真實的與其建言」。",
            "class": "spread-layout-3",
            "positions": ["➊ 我以為的狀態", "➋ 真實的狀態", "➌ 牌卡給予的建言"]
        },
        "core": {
            "name": "四張牌｜直指核心牌陣",
            "desc": "當生活某部分卡住、沒起色時使用，十字交叉定位能全面剖析問題。",
            "class": "spread-layout-4",
            "positions": ["➊ 問題的核心", "➋ 面臨的障礙", "➌ 建議的對策", "➍ 擁有的資源"]
        },
        "choice": {
            "name": "五張牌｜二選一＆可能的結果",
            "desc": "面臨兩個工作或重大抉擇時使用，分岔路由左至右清晰可見。",
            "class": "spread-layout-5-choice",
            "positions": ["➊ 選項 A 的狀態", "➋ 選項 B 的狀態", "➌ 選項 A 的結果", "➍ 選項 B 的結果", "➎ 當事人的狀態"]
        },
        "love": {
            "name": "五張牌｜感情萬用牌陣",
            "desc": "對稱檢視雙方的感情狀態、態度以及兩人的交會發展。",
            "class": "spread-layout-5-love",
            "positions": ["➊ 我的狀態", "➋ 我的感情態度", "➌ 對方的狀態", "➍ 對方的感情態度", "➎ 兩人的可能結果"]
        }
    };

    let currentCard = null;

    // 模式一、二、三 保持原功能
    function drawCard() {
        document.getElementById('interactiveZone').style.display = 'none'; 
        const card = TAROT_DATA[Math.floor(Math.random() * TAROT_DATA.length)];
        const isUpright = Math.random() > 0.5;
        const orientation = isUpright ? "正位" : "逆位";
        const keywordClass = isUpright ? "upright" : "reversed";
        const imgClass = isUpright ? "tarot-img" : "tarot-img reversed-img";
        const keywords = isUpright ? card.upright : card.reversed;

        const htmlContent = `
            <div style="text-align:center;">
                <h3 style="margin-top:0; font-size:1.3rem;">🔮 抽出牌卡：<span class="highlight">${card.name}</span> (${orientation})</h3>
                <div class="tarot-image-container">
                    <img src="${card.img}" alt="${card.name}" class="${imgClass}">
                </div>
                <hr class="divider">
                <p style="margin-bottom: 12px;"><strong>👁️ 牌面核心視覺：</strong><br><span style="color:#67e8f9">${card.visual}</span></p>
                <p><strong>💡 核心牌義 (<span class="${keywordClass}">${orientation}</span>)：</strong><br>${keywords}</p>
            </div>
        `;
        document.getElementById('displayBoard').innerHTML = htmlContent;
    }

    function startQuiz() {
        currentCard = TAROT_DATA[Math.floor(Math.random() * TAROT_DATA.length)];
        const htmlContent = `
            <h3 style="margin-top:0; color: var(--accent-color); font-size:1.3rem; text-align:center;">📝 偉特圖像聯想測驗</h3>
            <p style="margin-top: 10px; text-align:center; color:var(--text-muted);">請觀察以下【牌面視覺暗示】，猜猜它是哪張牌？</p>
            <div style="background-color: var(--bg-color); padding: 18px; border-radius: 8px; font-size: 1.1rem; border: 1px dashed var(--accent-color); margin: 18px 0; text-align:center;">
                <strong>「 ${currentCard.visual} 」</strong>
            </div>
        `;
        document.getElementById('displayBoard').innerHTML = htmlContent;
        
        document.getElementById('zoneContent').innerHTML = `
            <input type="text" id="userAnswer" placeholder="輸入牌名關鍵字 (例如: 愚者、魔術師...)" onkeyup="if(event.keyCode===13) checkAnswer()">
            <button class="btn-submit" onclick="checkAnswer()">提交答案</button>
        `;
        document.getElementById('interactiveZone').style.display = 'block';
        document.getElementById('feedbackZone').innerHTML = '';
        document.getElementById('userAnswer').focus();
    }

    function checkAnswer() {
        const userAns = document.getElementById('userAnswer').value.trim();
        const feedbackZone = document.getElementById('feedbackZone');
        if (!userAns) return;

        if (currentCard.name.includes(userAns) && userAns.length >= 1) {
            feedbackZone.innerHTML = `<span style="color:var(--success-color)">🎉 太棒了！完全答對！</span><br>
                                      <small style="color:var(--text-muted); font-size:0.95rem;">這張牌是：${currentCard.name}<br>正位：${currentCard.upright}</small>`;
            setTimeout(startQuiz, 2500);
        } else {
            feedbackZone.innerHTML = `<span style="color:var(--danger-color)">❌ 再接再厲！正確答案是：<span class="highlight">${currentCard.name}</span></span>`;
            setTimeout(startQuiz, 3200);
        }
    }

    function startStoryMode() {
        currentCard = TAROT_DATA[Math.floor(Math.random() * TAROT_DATA.length)];
        const htmlContent = `
            <h3 style="margin-top:0; color: var(--story-btn); font-size:1.3rem; text-align:center;">🎨 看圖說故事 (直覺訓練)</h3>
            <p style="margin-top: 5px; text-align:center; color:var(--text-muted);">眼前這張神祕牌面，你看到了什麼？</p>
            <div class="tarot-image-container">
                <img src="${currentCard.img}" alt="猜猜我是誰" class="tarot-img" style="border-color: var(--story-btn);">
            </div>
        `;
        document.getElementById('displayBoard').innerHTML = htmlContent;

        document.getElementById('zoneContent').innerHTML = `
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 8px; text-align:left;">
                ✍️ <strong>思考引導練習：</strong>主角是誰？身處什麼環境？有什麼關鍵道具？帶給你什麼感覺？
            </p>
            <textarea id="storyNotes" rows="3" placeholder="試著寫下你的畫面筆記..."></textarea>
            <button class="btn-reveal" onclick="revealStoryAnswer()">公布牌面真相與核心秘密</button>
        `;
        document.getElementById('interactiveZone').style.display = 'block';
        document.getElementById('feedbackZone').innerHTML = '';
    }

    function revealStoryAnswer() {
        const feedbackZone = document.getElementById('feedbackZone');
        const htmlReveal = `
            <div style="text-align:left; background-color: rgba(241, 196, 15, 0.1); padding: 15px; border-radius: 8px; border: 1px solid var(--accent-color); margin-top:15px; font-size:0.95rem; line-height:1.6;">
                <p style="font-size:1.1rem; margin-bottom:5px;"><strong class="highlight">✨ 這張牌是：${currentCard.name}</strong></p>
                <p><strong>👁️ 牌面視覺細節：</strong><br>${currentCard.visual}</p>
                <p style="margin-top:5px;"><strong>💡 正位義：</strong>${currentCard.upright}</p>
                <p><strong>💡 逆位義：</strong>${currentCard.reversed}</p>
            </div>
            <button class="btn-story" style="margin-top:15px;" onclick="startStoryMode()">下一張挑戰</button>
        `;
        feedbackZone.innerHTML = htmlReveal;
    }

    // 🆕 模式四：4大牌陣模擬模組（已徹底移除時間之流）
    function startSpreadMode() {
        document.getElementById('interactiveZone').style.display = 'none';

        let optionsHtml = '';
        for (let key in SPREADS) {
            optionsHtml += `<option value="${key}">${SPREADS[key].name}</option>`;
        }

        const htmlContent = `
            <h3 style="margin-top:0; color: var(--spread-btn); font-size:1.3rem; text-align:center;">📐 AI實作範例：4 大萬用牌陣模擬</h3>
            <p style="margin-top: 5px; text-align:center; color:var(--text-muted); margin-bottom: 15px;">「一個蘿蔔一個坑」，先選定牌陣，然後抽牌吧！</p>
            
            <div style="max-width: 400px; margin: 0 auto 20px auto;">
                <select id="spreadSelect" onchange="updateSpreadDesc()">
                    ${optionsHtml}
                </select>
                <p id="spreadDesc" style="color: var(--text-muted); font-size: 0.9rem; text-align: center; min-height: 40px;">
                    ${SPREADS['triangle'].desc}
                </p>
            </div>

            <div style="text-align: center;">
                <button class="btn-spread" style="width: auto; padding: 12px 30px;" onclick="drawSpreadCards()">進行占卜抽牌</button>
            </div>

            <div id="spreadResults" class="spread-grid"></div>
        `;
        document.getElementById('displayBoard').innerHTML = htmlContent;
    }

    function updateSpreadDesc() {
        const selected = document.getElementById('spreadSelect').value;
        document.getElementById('spreadDesc').innerText = SPREADS[selected].desc;
        document.getElementById('spreadResults').innerHTML = ''; // 清空先前的抽牌結果
    }

    function drawSpreadCards() {
        const selectedKey = document.getElementById('spreadSelect').value;
        const spread = SPREADS[selectedKey];
        const resultsContainer = document.getElementById('spreadResults');
        resultsContainer.innerHTML = '';

        // 重置並套用此牌陣專屬的 CSS Grid 類別
        resultsContainer.className = `spread-grid ${spread.class}`;

        // 隨機抽牌，且牌不能重複
        let shuffled = [...TAROT_DATA].sort(() => 0.5 - Math.random());
        
        let gridHtml = '';
        for (let i = 0; i < spread.positions.length; i++) {
            const card = shuffled[i];
            const isUpright = Math.random() > 0.5;
            const orientation = isUpright ? "正位" : "逆位";
            const imgClass = isUpright ? "tarot-img" : "tarot-img reversed-img";
            const keywords = isUpright ? card.upright : card.reversed;

            gridHtml += `
                <div class="spread-card-box pos-${i}">
                    <div class="spread-pos-title">${spread.positions[i]}</div>
                    <img src="${card.img}" alt="${card.name}" class="${imgClass}" style="margin:0;">
                    <div style="font-size:0.85rem; font-weight:bold; margin-top:8px;" class="highlight">${card.name.split(' ')[1]} (${orientation})</div>
                    <div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px; text-align:center; line-height:1.3;">
                        ${keywords.split('、').slice(0,2).join('、')}
                    </div>
                </div>
            `;
        }
        resultsContainer.innerHTML = gridHtml;
    }
</script>

</body>
</html>
